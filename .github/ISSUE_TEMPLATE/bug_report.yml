name: Bug report
description: Something in CommandHub isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you can give, the
        faster it can be reproduced and fixed.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of CommandHub is affected?
      options:
        - Dashboard / UI
        - Camera streaming
        - Sensors
        - Hardware telemetry
        - UART (USB serial)
        - Bluetooth
        - TCP console
        - Embedded web server / API
        - Flashlight
        - Build / Gradle
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I open a camera viewer the stream freezes after a few seconds...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps help a lot.
      placeholder: |
        1. Install the app on a physical device
        2. Open http://<ip>:8080/camera/0
        3. ...
      render: bash
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Phone model and Android version.
      placeholder: Pixel 7, Android 15
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CommandHub version
      description: The version or git commit you are running.
      placeholder: v1.2.0 or a commit hash
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Relevant `adb logcat`, Gradle, or browser console output.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I tested on a **physical Android device** (emulators lack the required hardware).
          required: true
        - label: I searched existing issues and this hasn't been reported before.
          required: true
