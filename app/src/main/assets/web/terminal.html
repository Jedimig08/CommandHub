<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
        }

        #console {
            border: 1px solid #333;
            height: 350px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
            background: #050505;
        }

        .line {
            margin-bottom: 2px;
            border-bottom: 1px solid #111;
        }

        .time {
            color: #888;
            font-size: 0.8em;
            margin-right: 10px;
        }

        input {
            background: #111;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 4px;
        }

        button {
            padding: 10px 15px;
            background: #007AFF;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        select {
            padding: 10px;
            background: #111;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
        }

        .macro-section {
            margin: 15px 0;
            background: #111;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 6px;
        }

        .macro-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .macro-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
        }

        .macro-btn {
            background: #222;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 8px 10px;
            border-radius: 4px;
            font-family: monospace;
            cursor: pointer;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: bold;
        }

        .macro-btn:hover {
            background: #0f0;
            color: #000;
        }

        .macro-editor {
            display: none;
            background: #181818;
            padding: 12px;
            border: 1px dashed #444;
            margin-top: 10px;
            border-radius: 4px;
        }

        .macro-edit-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }

        .macro-edit-row input {
            flex: 1;
            padding: 6px;
            font-size: 0.9em;
        }
    </style>

    <script>
        let ws;
        let lastActivity = Date.now();
        let keepaliveTimer = null;
        let heartbeatEnabled = false;
        let heartbeatPayload = 'PING';
        let heartbeatIntervalSeconds = 10;

        const HEARTBEAT_STORAGE_KEY = 'terminal_heartbeat';
        const HEARTBEAT_PAYLOAD_STORAGE_KEY = 'terminal_heartbeat_payload';
        const HEARTBEAT_INTERVAL_STORAGE_KEY = 'terminal_heartbeat_interval';
        const HEARTBEAT_DEFAULT_PAYLOAD = 'PING';
        const HEARTBEAT_DEFAULT_INTERVAL_SECONDS = 10;
        const HEARTBEAT_MIN_INTERVAL_SECONDS = 1;
        const HEARTBEAT_MAX_INTERVAL_SECONDS = 3600;

        const DEFAULT_MACROS = [
            { label: "M1: START", cmd: "START" },
            { label: "M2: STOP", cmd: "STOP" },
            { label: "M3: STATUS", cmd: "STATUS" },
            { label: "M4: LED ON", cmd: "LED_ON" },
            { label: "M5: LED OFF", cmd: "LED_OFF" },
            { label: "M6: RESET", cmd: "RESET" }
        ];

        let macros = JSON.parse(localStorage.getItem('terminal_macros') || JSON.stringify(DEFAULT_MACROS));

        const HISTORY_STORAGE_PREFIX = 'terminal_history_';
        const HISTORY_LIMIT = 100;
        const historyKey = HISTORY_STORAGE_PREFIX + window.location.pathname;
        let commandHistory = loadHistory();
        let historyIndex = 0;
        let historyDraft = '';

        function loadHistory() {
            try {
                const stored = JSON.parse(localStorage.getItem(historyKey) || '[]');
                if (!Array.isArray(stored)) return [];
                return stored.filter(item => typeof item === 'string').slice(0, HISTORY_LIMIT);
            } catch (e) {
                return [];
            }
        }

        function persistHistory() {
            localStorage.setItem(historyKey, JSON.stringify(commandHistory));
        }

        function rememberCommand(rawVal) {
            if (!rawVal) return;
            const value = String(rawVal);
            if (commandHistory[0] === value) return;
            commandHistory.unshift(value);
            if (commandHistory.length > HISTORY_LIMIT) commandHistory.length = HISTORY_LIMIT;
            persistHistory();
            historyIndex = 0;
            historyDraft = '';
        }

        function handleInputKey(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                send();
                return;
            }

            const input = document.getElementById('input');
            if (!input) return;

            if (event.key === 'ArrowUp') {
                if (commandHistory.length === 0) return;
                if (historyIndex === 0) historyDraft = input.value;
                historyIndex = Math.min(historyIndex + 1, commandHistory.length);
                input.value = commandHistory[historyIndex - 1];
                input.setSelectionRange(input.value.length, input.value.length);
                event.preventDefault();
                return;
            }

            if (event.key === 'ArrowDown') {
                if (historyIndex === 0) return;
                historyIndex -= 1;
                input.value = historyIndex === 0 ? historyDraft : commandHistory[historyIndex - 1];
                input.setSelectionRange(input.value.length, input.value.length);
                event.preventDefault();
            }
        }

        function getTime() {
            const d = new Date();
            return d.getHours().toString().padStart(2,'0') + ":" +
                   d.getMinutes().toString().padStart(2,'0') + ":" +
                   d.getSeconds().toString().padStart(2,'0') + "." +
                   d.getMilliseconds().toString().padStart(3,'0');
        }

        function appendLog(text) {
            if(!text || !text.trim()) return;
            const consoleDiv = document.getElementById('console');
            const div = document.createElement('div');
            div.className = 'line';
            div.innerHTML = '<span class="time">' + getTime() + '</span>' + text;
            consoleDiv.appendChild(div);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function parseHeartbeatInterval(raw) {
            const value = Number(raw);
            if (!Number.isFinite(value)) return HEARTBEAT_DEFAULT_INTERVAL_SECONDS;
            return Math.min(
                HEARTBEAT_MAX_INTERVAL_SECONDS,
                Math.max(HEARTBEAT_MIN_INTERVAL_SECONDS, Math.round(value))
            );
        }

        function loadHeartbeatSettings() {
            heartbeatEnabled = localStorage.getItem(HEARTBEAT_STORAGE_KEY) === 'true';
            const storedPayload = localStorage.getItem(HEARTBEAT_PAYLOAD_STORAGE_KEY);
            heartbeatPayload = storedPayload === null ? HEARTBEAT_DEFAULT_PAYLOAD : storedPayload;
            const storedInterval = localStorage.getItem(HEARTBEAT_INTERVAL_STORAGE_KEY);
            heartbeatIntervalSeconds = parseHeartbeatInterval(
                storedInterval === null ? HEARTBEAT_DEFAULT_INTERVAL_SECONDS : storedInterval
            );
        }

        function persistHeartbeatSettings() {
            localStorage.setItem(HEARTBEAT_STORAGE_KEY, heartbeatEnabled ? 'true' : 'false');
            localStorage.setItem(HEARTBEAT_PAYLOAD_STORAGE_KEY, heartbeatPayload);
            localStorage.setItem(HEARTBEAT_INTERVAL_STORAGE_KEY, String(heartbeatIntervalSeconds));
        }

        function updateHeartbeatStatus() {
            const status = document.getElementById('heartbeatStatus');
            if (!status) return;

            if (!heartbeatEnabled) {
                status.textContent = 'Keepalive off.';
                return;
            }
            if (!heartbeatPayload.trim()) {
                status.textContent = 'Keepalive on, but the payload is empty.';
                return;
            }

            const displayPayload = heartbeatPayload
                .replace(/\\/g, '\\\\')
                .replace(/\n/g, '\\n')
                .replace(/\r/g, '\\r')
                .replace(/\t/g, '\\t');
            status.textContent =
                'Sends "' + displayPayload + '" every ' + heartbeatIntervalSeconds + 's when idle.';
        }

        function toggleHeartbeat(enabled) {
            heartbeatEnabled = enabled;
            persistHeartbeatSettings();
            updateHeartbeatStatus();
            setupKeepalive();
        }

        function updateHeartbeatPayload(value) {
            heartbeatPayload = value;
            persistHeartbeatSettings();
            updateHeartbeatStatus();
        }

        function updateHeartbeatInterval(value) {
            heartbeatIntervalSeconds = parseHeartbeatInterval(value);
            const input = document.getElementById('heartbeatInterval');
            if (input) input.value = heartbeatIntervalSeconds;
            persistHeartbeatSettings();
            updateHeartbeatStatus();
            setupKeepalive();
        }

        function setupKeepalive() {
            if (keepaliveTimer) {
                clearInterval(keepaliveTimer);
                keepaliveTimer = null;
            }
            if (!heartbeatEnabled) return;

            keepaliveTimer = setInterval(() => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                if (!heartbeatPayload.trim()) return;
                if (Date.now() - lastActivity < heartbeatIntervalSeconds * 1000) return;
                ws.send(formatCommand(heartbeatPayload));
            }, heartbeatIntervalSeconds * 1000);
        }

        function connectWs() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(protocol + '//' + window.location.host + '{{wsEndpoint}}');

            ws.onopen = () => {
                setupKeepalive();
            };

            ws.onmessage = (e) => {
                lastActivity = Date.now();
                appendLog('<span style="color:#0f0;">RX:</span> ' + e.data);
            };

            ws.onclose = () => {
                if (keepaliveTimer) {
                    clearInterval(keepaliveTimer);
                    keepaliveTimer = null;
                }
                setTimeout(connectWs, 2000);
            };
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function formatCommand(cmd) {
            if (!cmd) return '';
            return cmd
                .replace(/\\n/g, '\n')
                .replace(/\\r/g, '\r')
                .replace(/\\t/g, '\t');
        }

        function sendCustom(rawVal) {
            if(!rawVal) return;
            rememberCommand(rawVal);
            const val = formatCommand(rawVal);
            lastActivity = Date.now();

            const displayLog = escapeHtml(val).replace(/\n/g, "<br>");
            appendLog('<span style="color:#007AFF;">TX:</span> ' + displayLog);

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(val);
            } else {
                fetch('{{sendEndpoint}}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain; charset=utf-8',
                        'X-CommandHub-Client': 'web'
                    },
                    body: val
                });
            }
        }

        function send() {
            const input = document.getElementById('input');
            const val = input.value;
            if(!val) return;
            sendCustom(val);
            input.value = '';
        }

        function renderMacros() {
            const grid = document.getElementById('macroGrid');
            const editorList = document.getElementById('macroEditorList');
            if(!grid || !editorList) return;

            grid.innerHTML = '';
            editorList.innerHTML = '';

            macros.forEach((m, idx) => {
                const btn = document.createElement('button');
                btn.className = 'macro-btn';
                btn.innerText = m.label || ('M' + (idx + 1));
                btn.onclick = () => sendCustom(m.cmd);
                grid.appendChild(btn);

                const row = document.createElement('div');
                row.className = 'macro-edit-row';
                row.style.alignItems = 'center';
                row.innerHTML =
                    '<input type="text" aria-label="Macro label" value="' + escapeHtml(m.label || '') + '" placeholder="Label" style="width:25%; font-weight:bold;" onchange="updateMacro(' + idx + ', \'label\', this.value)">' +
                    '<textarea aria-label="Macro command" placeholder="Command / Multi-line payload (supports \\n)" style="flex:1; height:42px; background:#111; color:#0f0; border:1px solid #444; font-family:monospace; padding:6px; border-radius:4px; resize:vertical;" onchange="updateMacro(' + idx + ', \'cmd\', this.value)">' + escapeHtml(m.cmd || '') + '</textarea>';
                editorList.appendChild(row);
            });
        }

        function updateMacro(idx, field, val) {
            macros[idx][field] = val;
            localStorage.setItem('terminal_macros', JSON.stringify(macros));
            renderMacros();
        }

        function toggleMacroEditor() {
            const ed = document.getElementById('macroEditor');
            if (ed) {
                ed.style.display = (ed.style.display === 'block') ? 'none' : 'block';
            }
        }

        function addMacroSlot() {
            macros.push({ label: 'M' + (macros.length + 1), cmd: '' });
            localStorage.setItem('terminal_macros', JSON.stringify(macros));
            renderMacros();
        }

        window.onload = () => {
            loadHeartbeatSettings();
            const cb = document.getElementById('enableHeartbeat');
            if (cb) cb.checked = heartbeatEnabled;
            const payloadInput = document.getElementById('heartbeatPayload');
            if (payloadInput) payloadInput.value = heartbeatPayload;
            const intervalInput = document.getElementById('heartbeatInterval');
            if (intervalInput) intervalInput.value = heartbeatIntervalSeconds;
            updateHeartbeatStatus();
            connectWs();
            renderMacros();
        };
    </script>
</head>
<body>
    <h1>{{title}}</h1>

    {{extraControls}}

    <div style="margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; color: #aaa; font-size: 0.9em;">
        <label style="cursor: pointer;">
            <input type="checkbox" id="enableHeartbeat" onchange="toggleHeartbeat(this.checked)"> Enable keepalive
        </label>
        <label>Payload
            <input
                type="text"
                id="heartbeatPayload"
                aria-label="Keepalive payload"
                placeholder="Any text, e.g. PING"
                style="width: 160px;"
                onchange="updateHeartbeatPayload(this.value)">
        </label>
        <label>Every
            <input
                type="number"
                id="heartbeatInterval"
                aria-label="Keepalive interval in seconds"
                min="1"
                max="3600"
                step="1"
                value="10"
                style="width: 80px;"
                onchange="updateHeartbeatInterval(this.value)">
            s
        </label>
        <span id="heartbeatStatus" style="color: #888;"></span>
    </div>

    <div class="macro-section">
        <div class="macro-header">
            <span style="color:#aaa; font-weight:bold; font-size:0.9em;">⚡ Quick Action Buttons</span>
            <button onclick="toggleMacroEditor()" style="background:#333; padding:5px 10px; font-size:0.8em;">⚙️ Configure Buttons</button>
        </div>
        <div id="macroGrid" class="macro-grid"></div>

        <div id="macroEditor" class="macro-editor">
            <div style="margin-bottom:8px; color:#fff; font-size:0.9em; font-weight:bold;">
                Edit Macro Buttons (Label & Command):
            </div>
            <div id="macroEditorList"></div>
            <button onclick="addMacroSlot()" style="background:#28a745; margin-top:8px; padding:5px 10px; font-size:0.8em;">+ Add Button</button>
        </div>
    </div>

    <div id="console"></div>

    <div style="display:flex; gap:10px;">
        <input
            type="text"
            id="input"
            aria-label="Enter command"
            placeholder="Enter command..."
            title="Use Arrow Up and Arrow Down to recall previous commands"
            style="flex:1;"
            onkeydown="handleInputKey(event)">

        <button onclick="send()">
            Send
        </button>
        <span style="font-size:0.8em; color:#888; align-self:center;">&#8593;/&#8595; history</span>
    </div>
</body>
</html>
