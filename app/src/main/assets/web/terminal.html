<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
        }

        #console {
            border: 1px solid #333;
            height: 350px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
            background: #050505;
        }

        .line {
            margin-bottom: 2px;
            border-bottom: 1px solid #111;
        }

        .time {
            color: #888;
            font-size: 0.8em;
            margin-right: 10px;
        }

        input {
            background: #111;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 4px;
        }

        button {
            padding: 10px 15px;
            background: #007AFF;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        select {
            padding: 10px;
            background: #111;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
        }

        .macro-section {
            margin: 15px 0;
            background: #111;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 6px;
        }

        .macro-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .macro-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
        }

        .macro-btn {
            background: #222;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 8px 10px;
            border-radius: 4px;
            font-family: monospace;
            cursor: pointer;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: bold;
        }

        .macro-btn:hover {
            background: #0f0;
            color: #000;
        }

        .macro-editor {
            display: none;
            background: #181818;
            padding: 12px;
            border: 1px dashed #444;
            margin-top: 10px;
            border-radius: 4px;
        }

        .macro-edit-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }

        .macro-edit-row input {
            flex: 1;
            padding: 6px;
            font-size: 0.9em;
        }
    </style>

    <script>
        let ws;
        let lastActivity = Date.now();

        const DEFAULT_MACROS = [
            { label: "M1: START", cmd: "START" },
            { label: "M2: STOP", cmd: "STOP" },
            { label: "M3: STATUS", cmd: "STATUS" },
            { label: "M4: LED ON", cmd: "LED_ON" },
            { label: "M5: LED OFF", cmd: "LED_OFF" },
            { label: "M6: RESET", cmd: "RESET" }
        ];

        let macros = JSON.parse(localStorage.getItem('terminal_macros') || JSON.stringify(DEFAULT_MACROS));

        function getTime() {
            const d = new Date();
            return d.getHours().toString().padStart(2,'0') + ":" +
                   d.getMinutes().toString().padStart(2,'0') + ":" +
                   d.getSeconds().toString().padStart(2,'0') + "." +
                   d.getMilliseconds().toString().padStart(3,'0');
        }

        function appendLog(text) {
            if(!text || !text.trim()) return;
            const consoleDiv = document.getElementById('console');
            const div = document.createElement('div');
            div.className = 'line';
            div.innerHTML = '<span class="time">' + getTime() + '</span>' + text;
            consoleDiv.appendChild(div);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function connectWs() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(protocol + '//' + window.location.host + '{{wsEndpoint}}');

            ws.onmessage = (e) => {
                appendLog('<span style="color:#0f0;">RX:</span> ' + e.data);
            };

            ws.onclose = () => {
                setTimeout(connectWs, 2000);
            };

            setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN && (Date.now() - lastActivity > 5000)) {
                    ws.send("PING");
                }
            }, 2000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function formatCommand(cmd) {
            if (!cmd) return '';
            return cmd
                .replace(/\\n/g, '\n')
                .replace(/\\r/g, '\r')
                .replace(/\\t/g, '\t');
        }

        function sendCustom(rawVal) {
            if(!rawVal) return;
            const val = formatCommand(rawVal);
            lastActivity = Date.now();

            const displayLog = escapeHtml(val).replace(/\n/g, "<br>");
            appendLog('<span style="color:#007AFF;">TX:</span> ' + displayLog);

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(val);
            } else {
                fetch('{{sendEndpoint}}', {
                    method: 'POST',
                    body: val
                });
            }
        }

        function send() {
            const input = document.getElementById('input');
            const val = input.value;
            if(!val) return;
            sendCustom(val);
            input.value = '';
        }

        function renderMacros() {
            const grid = document.getElementById('macroGrid');
            const editorList = document.getElementById('macroEditorList');
            if(!grid || !editorList) return;

            grid.innerHTML = '';
            editorList.innerHTML = '';

            macros.forEach((m, idx) => {
                const btn = document.createElement('button');
                btn.className = 'macro-btn';
                btn.innerText = m.label || ('M' + (idx + 1));
                btn.onclick = () => sendCustom(m.cmd);
                grid.appendChild(btn);

                const row = document.createElement('div');
                row.className = 'macro-edit-row';
                row.style.alignItems = 'center';
                row.innerHTML =
                    '<input type="text" aria-label="Macro label" value="' + escapeHtml(m.label || '') + '" placeholder="Label" style="width:25%; font-weight:bold;" onchange="updateMacro(' + idx + ', \'label\', this.value)">' +
                    '<textarea aria-label="Macro command" placeholder="Command / Multi-line payload (supports \\n)" style="flex:1; height:42px; background:#111; color:#0f0; border:1px solid #444; font-family:monospace; padding:6px; border-radius:4px; resize:vertical;" onchange="updateMacro(' + idx + ', \'cmd\', this.value)">' + escapeHtml(m.cmd || '') + '</textarea>';
                editorList.appendChild(row);
            });
        }

        function updateMacro(idx, field, val) {
            macros[idx][field] = val;
            localStorage.setItem('terminal_macros', JSON.stringify(macros));
            renderMacros();
        }

        function toggleMacroEditor() {
            const ed = document.getElementById('macroEditor');
            if (ed) {
                ed.style.display = (ed.style.display === 'block') ? 'none' : 'block';
            }
        }

        function addMacroSlot() {
            macros.push({ label: 'M' + (macros.length + 1), cmd: '' });
            localStorage.setItem('terminal_macros', JSON.stringify(macros));
            renderMacros();
        }

        window.onload = () => {
            connectWs();
            renderMacros();
        };
    </script>
</head>
<body>
    <h1>{{title}}</h1>

    {{extraControls}}

    <div class="macro-section">
        <div class="macro-header">
            <span style="color:#aaa; font-weight:bold; font-size:0.9em;">⚡ Quick Action Buttons</span>
            <button onclick="toggleMacroEditor()" style="background:#333; padding:5px 10px; font-size:0.8em;">⚙️ Configure Buttons</button>
        </div>
        <div id="macroGrid" class="macro-grid"></div>

        <div id="macroEditor" class="macro-editor">
            <div style="margin-bottom:8px; color:#fff; font-size:0.9em; font-weight:bold;">
                Edit Macro Buttons (Label & Command):
            </div>
            <div id="macroEditorList"></div>
            <button onclick="addMacroSlot()" style="background:#28a745; margin-top:8px; padding:5px 10px; font-size:0.8em;">+ Add Button</button>
        </div>
    </div>

    <div id="console"></div>

    <div style="display:flex; gap:10px;">
        <input
            type="text"
            id="input"
            aria-label="Enter command"
            placeholder="Enter command..."
            style="flex:1;"
            onkeydown="if(event.key==='Enter') send()">

        <button onclick="send()">
            Send
        </button>
    </div>
</body>
</html>
