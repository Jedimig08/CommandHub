<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommandHub — Authentication</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; text-align: center; }
        .card { background: #1e293b; border: 2px solid #38bdf8; border-radius: 12px; padding: 30px; max-width: 400px; margin: 40px auto; box-shadow: 0 4px 20px rgba(56,189,248,0.2); }
        h1 { color: #38bdf8; margin-top: 0; font-size: 1.5rem; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; box-sizing: border-box; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; }
        button:hover { background: #0ea5e9; }
        #message { margin-top: 15px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>CommandHub Login</h1>
        <p>Enter your 256-bit bearer token from the Android app settings to authenticate this browser session.</p>
        <input type="password" id="tokenInput" placeholder="Enter Token..." />
        <button onclick="login()">Authenticate</button>
        <div id="message"></div>
    </div>
    <script>
        async function login() {
            const token = document.getElementById('tokenInput').value;
            const msg = document.getElementById('message');
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CommandHub-Client': 'web' },
                    body: JSON.stringify({ token })
                });
                if (res.ok) {
                    msg.style.color = '#34d399';
                    msg.innerText = 'Success! Redirecting...';
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    const data = await res.json();
                    msg.style.color = '#ef4444';
                    msg.innerText = data.error || 'Authentication failed';
                }
            } catch (err) {
                msg.style.color = '#ef4444';
                msg.innerText = 'Network error: ' + err.message;
            }
        }
    </script>
</body>
</html>
